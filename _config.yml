# Source-of-truth exclusions for native GitHub Pages (Jekyll).
# GitHub Pages publishes main; the custom workflow only runs QA.
# Keep internal source and paid-course assets out of the public build.
exclude:
  - ".github/"
  - "academy-private/"
  - "academy-app/"
  - "api/"
  - "backend-iagile/"
  - "docs/"
  - "supabase/"
  - "tests/"
  - "scripts/"
  - "public-site/"
  - ".github/workflows/chatbot-qa.yml"
  - ".github/workflows/deploy.yml"
  - "ressources/README.md"
  - "README.md"
  - "_config.yml"
  - "api/chat.js"
  - "backend-iagile/README.md"
  - "backend-iagile/api/chat.js"
  - "backend-iagile/package.json"
  - "backend-iagile/supabase/database.types.ts"
  - "backend-iagile/tests/chat-security.test.mjs"
  - "backend-iagile/tests/schema.test.mjs"
  - "docs/ACADEMY-CURRICULUM-ROADMAP.md"
  - "docs/ACADEMY-PLAN.md"
  - "docs/ACADEMY-RELEASE-CHECKLIST.md"
  - "docs/CHATBOT-IA-DEPLOIEMENT.md"
  - "docs/ETAT-LANCEMENT.md"
  - "docs/TRAMES-JURIDIQUES-INTERNE.md"
  - "learning-engine.css"
  - "learning-engine.js"
  - "nav-world.css"
  - "nav-world.js"
  - "orbit.css"
  - "package.json"
  - "tests/chat.test.mjs"
  - "tests/current-live-exposure.test.mjs"
  - "tests/jekyll-boundary.test.mjs"
  - "tests/live-site-check.mjs"
  - "tests/live-public-resources.test.mjs"
  - "tests/publication-boundary.test.mjs"
  - "tests/site-check.mjs"
  - "webgl.js"
