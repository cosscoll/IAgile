name: Verify IAgile marketing resources
on:
  pull_request:
    paths:
      - 'ressources/**'
      - 'formations/**'
      - 'sitemap.xml'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/verify-marketing.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify site structure and resources
        run: npm test
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Test interactive resources in Chromium
        run: node tests/resource-browser.mjs
      - name: Save desktop and mobile previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iagile-resource-previews
          path: resource-preview-*.png
          if-no-files-found: ignore
