name: Deploy IAgile CHROME vitrine
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: iagile-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prépublication — contrôler les pages et les scripts
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: QA du site avant publication
        shell: bash
        run: |
          set -euo pipefail
          node tests/site-check.mjs
          node --test tests/chat.test.mjs
          node tests/publication-boundary.test.mjs
          node --check script.js
          node --check chatbot.js
          node --check chatbot-ai.js
          node --check api/chat.js
          node --check formation.js
          node --check parcours.js
      - name: Stage approved public assets only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-site
          files=(
            "404.html"
            "a-propos.html"
            "assets/social-accueil.jpg"
            "assets/social-agents-personnalises.jpg"
            "assets/social-automatiser-tache.jpg"
            "assets/social-ia-au-quotidien.jpg"
            "assets/social-sites-web-3d.jpg"
            "catalogue.css"
            "chatbot.css"
            "chat-config.js"
            "chatbot-ai.js"
            "chatbot.js"
            "chrome-v10.css"
            "course-v13.css"
            "engine.js"
            "faq.html"
            "favicon.svg"
            "formation.css"
            "formation.js"
            "formations/agents-personnalises.html"
            "formations/automatiser-tache.html"
            "formations/ia-au-quotidien.html"
            "formations/sites-web-3d.html"
            "guide.css"
            "index.html"
            "intro-v12.css"
            "ouverture.html"
            "parcours.html"
            "parcours.js"
            "pilote/continuer.html"
            "pilote/index.html"
            "responsive-v19.css"
            "robots.txt"
            "script.js"
            "site-v13.css"
            "sitemap.xml"
            "styles.css"
            "v21-conversion.css"
          )
          for path in "${files[@]}"; do
            test -f "$path" || { echo "Missing public asset: $path"; exit 1; }
            mkdir -p "public-site/$(dirname "$path")"
            cp "$path" "public-site/$path"
          done
          actual=$(find public-site -type f | wc -l)
          test "$actual" -eq "${#files[@]}"
          test ! -e public-site/docs
          test ! -e public-site/learning-engine.js
          test ! -e public-site/learning-engine.css
          test ! -e public-site/.git
          node tests/publication-boundary.test.mjs public-site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload approved static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Vérifier le site réellement accessible après publication
        shell: bash
        run: node tests/live-site-check.mjs
