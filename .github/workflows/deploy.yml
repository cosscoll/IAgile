name: IAgile — QA only (native GitHub Pages publishes)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iagile-qa-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prépublication — contrôler les pages et les scripts
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: QA du site avant publication
        shell: bash
        run: |
          set -euo pipefail
          node tests/site-check.mjs
          node --test tests/chat.test.mjs
          node tests/publication-boundary.test.mjs
          node tests/jekyll-boundary.test.mjs
          node --check script.js
          node --check chatbot.js
          node --check chatbot-ai.js
          node --check api/chat.js
          node --check formation.js
          node --check parcours.js
          node --check tests/live-site-check.mjs
          node --check tests/public-live-proof.mjs
          node --check scripts/build-public.mjs
          node --check tests/staged-public.test.mjs
      - name: Construire et inspecter les seuls actifs publics (sans déploiement)
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "404.html"
            "a-propos.html"
            "assets/social-accueil.jpg"
            "assets/social-agents-personnalises.jpg"
            "assets/social-automatiser-tache.jpg"
            "assets/social-ia-au-quotidien.jpg"
            "assets/social-sites-web-3d.jpg"
            "catalogue.css"
            "chatbot.css"
            "chat-config.js"
            "chatbot-ai.js"
            "chatbot.js"
            "chrome-v10.css"
            "course-v13.css"
            "engine.js"
            "faq.html"
            "favicon.svg"
            "formation.css"
            "formation.js"
            "formations/agents-personnalises.html"
            "formations/automatiser-tache.html"
            "formations/ia-au-quotidien.html"
            "formations/sites-web-3d.html"
            "guide.css"
            "index.html"
            "intro-v12.css"
            "ouverture.html"
            "parcours.html"
            "parcours.js"
            "pilote/continuer.html"
            "pilote/index.html"
            "ressources/agent-readiness.html"
            "ressources/brief-site-3d.html"
            "ressources/demo-processus.html"
            "ressources/demo-processus.js"
            "ressources/diagnostic-10-questions.html"
            "ressources/diagnostic-10.js"
            "ressources/diagnostic-ia.html"
            "ressources/incident-lab.html"
            "ressources/index.html"
            "ressources/promo.css"
            "ressources/ressources.css"
            "ressources/ressources.js"
            "responsive-v19.css"
            "robots.txt"
            "script.js"
            "site-v13.css"
            "sitemap.xml"
            "styles.css"
            "v21-conversion.css"
          )
          node scripts/build-public.mjs
          node tests/publication-boundary.test.mjs public-site
          node tests/staged-public.test.mjs
