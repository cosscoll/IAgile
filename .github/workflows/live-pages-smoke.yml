name: IAgile - Vérification du site réellement publié
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
concurrency:
  group: iagile-published-site-smoke
  cancel-in-progress: true
jobs:
  live-check:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier le SHA, les exercices et l'exclusion des fichiers internes
        run: node tests/live-public-resources.test.mjs
