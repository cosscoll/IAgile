name: IAgile - QA chatbot IA
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/iagile-assistant-generatif-v22]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Vérifier fichiers et scripts
        run: |
          npm test
          node --check chatbot.js
          node --check chatbot-ai.js
          node --check api/chat.js
