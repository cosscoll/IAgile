name: IAgile - QA chatbot et academy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/iagile-assistant-generatif-v22]
concurrency:
  group: academy-unit-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Vérifier les pages et les scripts publics
        run: |
          npm test
          node --check chatbot.js
          node --check chatbot-ai.js
          node --check api/chat.js
      - name: Tester le backend isolé
        working-directory: backend-iagile
        run: npm test
      - name: Contrôler le prototype Academy
        run: |
          node --check academy-private/app.js
          node --check academy-private/instructor.js
          node --check academy-private/deliverables.js
          node --test academy-private/tests/*.test.mjs
