name: IAgile - QA chatbot IA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/iagile-assistant-generatif-v22]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Vérifier fichiers et scripts publics
        run: |
          npm test
          node --check chatbot.js
          node --check chatbot-ai.js
          node --check api/chat.js
          node --check tests/live-site-check.mjs
      - name: Auditer les fichiers internes du site public actuel
        run: node tests/current-live-exposure.test.mjs
      - name: Tester la sécurité du backend isolé
        working-directory: backend-iagile
        run: npm test
      - name: Tester les interfaces privées Academy et les outils de ressources
        run: |
          node --check academy-private/app.js
          node --check academy-private/instructor.js
          node --check academy-private/deliverables.js
          node --check academy-private/assets.js
          node --test academy-private/tests/*.test.mjs
          python3 -m unittest discover -s academy-private/scripts -p 'test_*.py'
