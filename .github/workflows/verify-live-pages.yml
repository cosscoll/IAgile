name: IAgile — Verify live Pages publication
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"
permissions:
  contents: read
concurrency:
  group: iagile-live-check
  cancel-in-progress: false
jobs:
  live:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public revision, allowed paths, and private exclusions
        run: node tests/public-live-proof.mjs
