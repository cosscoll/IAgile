name: IAgile — Academy browser QA (private shell)
on:
  pull_request:
    paths:
      - 'academy-app/**'
      - 'tests/academy-*.mjs'
      - '.github/workflows/academy-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch reviewed source
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test runner
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.1
      - name: Confirm deployed SDK version is reachable
        run: node tests/academy-sdk-cdn.test.mjs
      - name: Install browser and required system packages
        run: npx playwright install --with-deps chromium
      - name: Run mock-only visual and access smoke tests
        run: |
          node tests/academy-browser.test.mjs
          node tests/academy-instructor-browser.test.mjs
          node tests/academy-pilot-browser.test.mjs
          node tests/academy-free-resources-browser.test.mjs
          node tests/academy-preflight-browser.test.mjs
          node tests/academy-evidence-browser.test.mjs
          node tests/academy-3d-diagnostic-browser.test.mjs
      - name: Archive simulated UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academy-mock-browser-previews
          path: academy-browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7
